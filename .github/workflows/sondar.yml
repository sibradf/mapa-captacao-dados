name: Sondar arquivos
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/sondar.yml']
permissions:
  contents: write
jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/sondar.py siconv_programa_proponentes siconv_convenio siconv_emenda siconv_proposta siconv_programa > /tmp/sondagem.txt 2>&1 || true
      - name: Publicar resultado no ramo sondagem
        run: |
          git config user.name "robo-mapadegoverno"; git config user.email "robo@mapadegoverno.com.br"
          git checkout --orphan sondagem && git rm -rfq . && cp /tmp/sondagem.txt sondagem.txt
          git add sondagem.txt && git commit -qm "Resultado da sondagem" && git push -f origin sondagem
