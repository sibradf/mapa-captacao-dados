name: Sondar arquivos
on: workflow_dispatch
jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/sondar.py data_carga_siconv siconv_programa siconv_programa_proponentes siconv_programa_proposta siconv_proposta siconv_convenio siconv_emenda
