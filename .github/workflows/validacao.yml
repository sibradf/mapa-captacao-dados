name: Gabarito do validador
on:
  workflow_dispatch:
  schedule:
    - cron: '55 10 * * *'
permissions:
  contents: write
concurrency: validacao
jobs:
  gabarito:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/gabarito.py /tmp/val 2>&1 | tee /tmp/val_log.txt
      - name: Publicar no ramo validacao
        run: |
          cp /tmp/val_log.txt /tmp/val/ultimo_log.txt
          git config user.name "robo-mapadegoverno"; git config user.email "robo@mapadegoverno.com.br"
          git checkout --orphan val-novo && git rm -rfq . || true
          cp /tmp/val/* .
          git add -A && git commit -qm "Gabarito do validador $(date -u +%Y-%m-%d)" && git push -f origin val-novo:validacao
