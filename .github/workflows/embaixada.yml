name: Painel de embaixada
on:
  workflow_dispatch:
    inputs:
      pais: { description: 'Código do país no MDIC (Japão = 399)', default: '399' }
      moeda: { description: 'Moeda (PTAX)', default: 'JPY' }
      termo: { description: 'Termo em inglês para as manchetes', default: 'Japan' }
      termo_pt: { description: 'Termo em português para as manchetes', default: 'Japão' }
  schedule:
    - cron: '40 10 * * *'
permissions:
  contents: write
concurrency: embaixada
jobs:
  painel:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/embaixada.py /tmp/emb "${{ github.event.inputs.pais || '399' }}" "${{ github.event.inputs.moeda || 'JPY' }}" "${{ github.event.inputs.termo || 'Japan' }}" "${{ github.event.inputs.termo_pt || 'Japão' }}" 2>&1 | tee /tmp/emb_log.txt
      - name: Publicar no ramo embaixada
        run: |
          cp /tmp/emb_log.txt /tmp/emb/ultimo_log.txt
          git config user.name "robo-mapadegoverno"; git config user.email "robo@mapadegoverno.com.br"
          git fetch origin embaixada || true
          git checkout --orphan emb-novo && git rm -rfq . || true
          (git checkout origin/embaixada -- . 2>/dev/null || true)
          cp /tmp/emb/* .
          git add -A && git commit -qm "Painel de embaixada $(date -u +%Y-%m-%d)" && git push -f origin emb-novo:embaixada
